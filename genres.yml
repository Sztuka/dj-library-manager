# ============================================================================
# Canonical genre definitions for dj-library-manager
# ============================================================================
#
# Each entry defines:
#   label     – human-readable name (used in UI, CSV export, Rekordbox tags)
#   category  – genre family (electronic, rock, pop, urban, caribbean, world,
#               jazz, other). Used by genre_resolver to decide source trust.
#   boost     – specificity multiplier (default 1.0). Subgenres get > 1.0 so
#               they beat their parent genre in weighted scoring.
#   synonyms  – all known aliases. Matching is CASE-INSENSITIVE and
#               PUNCTUATION-NORMALIZED, so only ONE variant per normalized
#               form is needed (e.g. "afro house" covers "Afro House" too).
#
# Rules:
#   • NO case-only duplicates (both consumers normalize to lowercase)
#   • NO cross-genre duplicates (each synonym maps to exactly one genre)
#   • Prefer lowercase in synonyms for readability
#   • Keep variants that differ in spacing/punctuation ("afro-house" vs
#     "afrohouse") — they normalize differently in genre_canonical.py
# ============================================================================

