# ============================================================================
# Canonical genre definitions for dj-library-manager
# ============================================================================
#
# Each entry defines:
#   label     – human-readable name (used in UI, CSV export, Rekordbox tags)
#   family    – genre family for hierarchical classification & family accuracy
#              (House, Techno, Trance, Bass, Dance, Synth, Ambient, Pop, Rock,
#               Hip-Hop, Caribbean, World, Jazz, Funk/Soul)
#   category  – broad category for source trust heuristics
#              (electronic, pop, rock, urban, caribbean, world, jazz, other)
#   synonyms  – aliases for matching external API tags (Beatport, MusicBrainz,
#               Last.fm, Discogs). CASE-INSENSITIVE + PUNCTUATION-NORMALIZED.
#
# Genre classification is done by LLM (GPT-5-nano) — synonyms exist only to
# map external metadata tags to canonical genres, NOT for scoring/boosting.
#
# Rules:
#   • NO case-only duplicates (consumers normalize to lowercase)
#   • NO cross-genre duplicates (each synonym → exactly one genre)
#   • Keep spacing/punctuation variants ("afro-house" vs "afrohouse")
#   • Every genre MUST have a family field
# ============================================================================

