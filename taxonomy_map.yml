# ==========================================
# DEPRECATED - Legacy tag → bucket mapping
# ==========================================
# This file mapped external tags (Last.fm/SoundCloud) to old bucket taxonomy.
# The new system (November 2025) uses:
#   - genres.yml for canonical genre definitions (30 genres with synonyms)
#   - djlib/metadata/genre_resolver.py for multi-source genre resolution
#   - destination column (library/reject/archive/mixes) instead of buckets
# This file is kept for backward compatibility only.
# See: genres.yml for active genre system
# ==========================================

# Map external tags (Last.fm/SoundCloud) to your taxonomy buckets
# Keys are lowercased tags; values must match entries in taxonomy.yml ready_buckets
# Feel free to extend and tweak weights/coverage later.
map:
  # CLUB section mappings
  house: "CLUB/HOUSE"
  progressive house: "CLUB/HOUSE"
  progressive: "CLUB/HOUSE"
  tech house: "CLUB/TECH HOUSE"
  tech-house: "CLUB/TECH HOUSE"
  deep house: "CLUB/DEEP HOUSE"
  afro house: "CLUB/AFRO HOUSE"
  afro: "CLUB/AFRO HOUSE"
  melodic techno: "CLUB/MELODIC TECHNO"
  techno: "CLUB/TECHNO"
  trance: "CLUB/TRANCE"
  drum and bass: "CLUB/DNB"
  dnb: "CLUB/DNB"
  drum n bass: "CLUB/DNB"
  electro: "CLUB/ELECTRO"
  electro swing: "CLUB/ELECTRO SWING"
  swing: "CLUB/ELECTRO SWING"
  # OPEN FORMAT section mappings
  hip hop: "OPEN FORMAT/HIP-HOP"
  hip-hop: "OPEN FORMAT/HIP-HOP"
  rap: "OPEN FORMAT/HIP-HOP"
  r&b: "OPEN FORMAT/RNB"
  rnb: "OPEN FORMAT/RNB"
  contemporary r&b: "OPEN FORMAT/RNB"
  latin: "OPEN FORMAT/LATIN REGGAETON"
  reggaeton: "OPEN FORMAT/LATIN REGGAETON"
  funk: "OPEN FORMAT/FUNK"
  soul: "OPEN FORMAT/SOUL"
  disco: "OPEN FORMAT/DISCO"
  rock: "OPEN FORMAT/ROCK CLASSICS"
  classic rock: "OPEN FORMAT/ROCK CLASSICS"
  rocknroll: "OPEN FORMAT/ROCKNROLL"
  rock 'n' roll: "OPEN FORMAT/ROCKNROLL"
  # Era mappings
  70s: "OPEN FORMAT/70s"
  80s: "OPEN FORMAT/80s"
  90s: "OPEN FORMAT/90s"
  2000s: "OPEN FORMAT/2000s"
  2010s: "OPEN FORMAT/2010s"
  # Generic electronic/dance keywords map to house (not canonical genres)
  electronic: "CLUB/HOUSE"
  dance: "OPEN FORMAT/POP"
  pop: "OPEN FORMAT/POP"
