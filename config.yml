INBOX_UNSORTED: ~/Music Unsorted # Inbox for new tracks
LIB_ROOT: ~/Music Library # Main library - approved tracks (Artist/file.ext)
REJECT_ROOT: ~/Music Rejected # Rejected tracks (flat structure)
ARCHIVE_ROOT: ~/Music Archive # Archived tracks (Artist/file.ext)
MIXES_ROOT: ~/Music Library/MIXES # DJ mixes (flat structure, no metadata)
LOGS_DIR: ./LOGS # Application logs (inside project repo)
UNSORTED_CSV: ./data/unsorted.csv # Staging CSV file (inside repo)

# Application API keys (public, can be committed)
acoustid_api_key: REDACTED_ACOUSTID_KEY

# MusicBrainz User-Agent (required by MB Web Service Terms)
musicbrainz:
  app_name: DJLibraryManager
  app_version: 0.1
  contact: https://github.com/Sztuka/dj-library-manager
  live_data_feed_token: REDACTED_MB_TOKEN

  lastfm_api_key: REDACTED_LASTFM_KEY
  soundcloud_client_id: REDACTED_SOUNDCLOUD_ID
  youtube_api_key: REDACTED_YOUTUBE_KEY

preferences:
  auto_format_new_labels: false
  label_style: as_is
