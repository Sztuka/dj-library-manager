INBOX_UNSORTED: ~/Music Unsorted # Inbox for new tracks
LIB_ROOT: ~/Music Library # Main library - approved tracks (Artist/file.ext)
REJECT_ROOT: ~/Music Rejected # Rejected tracks (flat structure)
ARCHIVE_ROOT: ~/Music Archive # Archived tracks (Artist/file.ext)
MIXES_ROOT: ~/Music Library/MIXES # DJ mixes (flat structure, no metadata)
LOGS_DIR: ./LOGS # Application logs (inside project repo)
UNSORTED_CSV: ./data/unsorted.csv # Staging CSV file (inside repo)

# AI models — override in config.local.yml (gitignored)
# Chat model: used for AI Chat with web search (needs Responses API support)
ai_chat_model: gpt-4.1-mini
# Quick model: used for one-shot tasks (identify track, suggest genre)
ai_quick_model: gpt-4o-mini

# API keys — set real values in config.local.yml (gitignored)
acoustid_api_key: ""

# MusicBrainz User-Agent (required by MB Web Service Terms)
musicbrainz:
  app_name: DJLibraryManager
  app_version: 0.1
  contact: https://github.com/Sztuka/dj-library-manager
  live_data_feed_token: ""

  lastfm_api_key: ""
  soundcloud_client_id: ""
  youtube_api_key: ""

# Optional Discogs personal access token — bumps rate limit from 25 to 60 req/min
# Anonymous works fine for low-volume use. Generate at:
# https://www.discogs.com/settings/developers
discogs_token: ""

preferences:
  auto_format_new_labels: false
  label_style: as_is
