# SearXNG — self-hosted metasearch engine for DJ Library Manager
#
# Usage:
#   docker compose -f docker/docker-compose.searxng.yml up -d
#   # Instance available at http://localhost:8888
#   # JSON API: http://localhost:8888/search?q=test&format=json
#
# To stop:
#   docker compose -f docker/docker-compose.searxng.yml down

services:
  searxng:
    image: searxng/searxng:latest
    container_name: djlib-searxng
    ports:
      - "8888:8080"
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Allow JSON API without rate limiting for local use
      - SEARXNG_SECRET=djlib-local-secret
    restart: unless-stopped

volumes:
  searxng-data:
